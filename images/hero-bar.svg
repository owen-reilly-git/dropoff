<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <defs>
    <radialGradient id="room" cx="50%" cy="55%" r="75%">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="1" stop-color="#120b07"/>
    </radialGradient>
    <radialGradient id="flame" r="50%">
      <stop offset="0" stop-color="#f3c77a" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#e2a95b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e2a95b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2f1f"/>
      <stop offset="1" stop-color="#1e140f"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#room)"/>
  <!-- back bar shelves -->
  <g fill="#2b1d16"><rect x="0" y="330" width="2400" height="14"/><rect x="0" y="560" width="2400" height="14"/></g>
  <!-- the one TV -->
  <rect x="1640" y="150" width="340" height="190" rx="6" fill="#1b2224" stroke="#0d0906" stroke-width="10"/>
  <rect x="1640" y="150" width="340" height="190" rx="6" fill="#6a8a8f" opacity="0.12"/>
  <!-- bar top -->
  <rect x="0" y="880" width="2400" height="470" fill="url(#bar)"/>
  <rect x="0" y="872" width="2400" height="16" fill="#5e3b26"/>
  <!-- candles -->
  <g>
    <circle cx="420" cy="840" r="150" fill="url(#flame)"/><rect x="408" y="835" width="24" height="46" rx="4" fill="#d9c7a6"/>
    <circle cx="1020" cy="850" r="120" fill="url(#flame)"/><rect x="1010" y="845" width="20" height="38" rx="4" fill="#d9c7a6"/>
    <circle cx="1560" cy="840" r="150" fill="url(#flame)"/><rect x="1548" y="835" width="24" height="46" rx="4" fill="#d9c7a6"/>
    <circle cx="2080" cy="850" r="120" fill="url(#flame)"/><rect x="2070" y="845" width="20" height="38" rx="4" fill="#d9c7a6"/>
  </g>
  <text x="50%" y="22%" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="#e2a95b">TODO: replace photo</text>
  <text x="50%" y="29%" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#d9c7a6">The bar at night, candles lit</text>
  <text x="50%" y="34%" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#d9c7a6">images/hero-bar.svg  (2400 × 1350)</text>
</svg>
